name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python eval/run_retrieval_eval.py --docs tests/fixtures --questions eval/demo_questions.yaml
      - run: python eval/run_answer_eval.py score --run /tmp/demo-run --docs tests/fixtures --questions eval/demo_questions.yaml --answers eval/demo_answers.jsonl --judge none

  # Separate from `test`: needs no Python dependencies.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No standards files in the tree (ADR-0002)
        run: python3 scripts/check_release_tree.py
      # Pinned release binary instead of gitleaks/gitleaks-action: the action needs a licence key for
      # organisation repositories, the binary does not, and version plus checksum are fixed here.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "${base}/${tarball}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Secret scan (the checked-out tree)
        run: ./gitleaks dir . --redact --no-banner
