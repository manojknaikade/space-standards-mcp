name: Publish to PyPI

# Runs only in the public repository (never on -dev). Trusted Publishing: no API token is stored.
# One-time setup and the release order are in docs/PUBLISHING.md. A tag push alone does not publish: the
# release flow pushes a tag for every release, and publishing is a separate owner step (a GitHub Release).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'manojknaikade/space-standards-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version ${version}"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.repository == 'manojknaikade/space-standards-mcp'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
