# Coverage evaluation set: all ECSS branches (M, Q, E, U, S) and the NASA standard families.
#
# 70 questions (x-07 and x-08 became lookups and x-11 was added when the NPRs were downloaded, 10 Nov 2026).
# 69 at the baseline. Drafted 10 Nov 2026 by nine subagents (one per standards area) from the source PDFs, then
# reviewed by the orchestrator: every expected clause, item letter or tag was checked to be printed on the stated
# page (script), 15 questions were hand-checked against the source page, 11 drafts were dropped (6 "not covered"
# drafts that another standard in the folder does treat, 5 with loose or ambiguous references).
# Owner review is pending for all of them.
#
# Fields: "expected" entries give doc_id and issue as catalogued, cover_issue (issue and date as printed on the
# cover), clause, req_ids (ECSS clause + letter, NASA tag or paragraph item; [] for prose and definitions) and
# page (1-based PDF page). Questions of type "revision" name an issue that is not the loaded one (asked_issue
# or asked_doc); "expected" is the loaded issue the server must point to. Type "not_covered": nothing in the
# documents folder answers it. answer_points are paraphrases, never standard text (ADR-0002).
# Scored by eval/run_coverage_eval.py (deterministic) and eval/run_answer_eval.py --questions <this file>.

- id: msu-01
  area: ECSS-M/S/U/P (management, system, sustainability)
  type: definition
  names_standard: false
  question: In ECSS terminology, what exactly is a 'residual risk'?
  expected:
  - doc_id: ECSS-S-ST-00-01C
    issue: Rev.1
    cover_issue: Third issue, Revision 1, 11 October 2023
    clause: 2.3.193
    req_ids: []
    page: 39
  answer_points:
  - It is the risk that is still there once the risk reduction measures have been carried out.
  - The definition is taken over from ISO 17666 and is held in the ECSS glossary rather than in the risk management
    standard.
  kind_note: definition (glossary entry)
  review: 'auto-checked: clause and item letters or tags printed on the stated page'
- id: msu-02
  area: ECSS-M/S/U/P (management, system, sustainability)
  type: lookup
  names_standard: false
  question: By which project milestone must the supplier have the product tree finalised, and when does it have
    to be first established?
