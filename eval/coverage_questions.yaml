  review: hand-checked against the source page
- id: sw-05
  area: ECSS software (E-40, Q-80)
  type: lookup
  names_standard: false
  question: When does a software development or verification tool have to be qualified at all, for example a code
    checker that we use instead of manual inspection?
  expected:
  - doc_id: ECSS-Q-HB-80-01A
    issue: ''
    cover_issue: First issue, 5 December 2011
    clause: '6.1'
    req_ids: []
    page: 26
  answer_points:
  - Qualification is needed when the tool's results are the sole evidence that software requirements are met; if
    its output is verified by other means (e.g. manual inspection) it does not need qualification.
  - 'A tool needs qualification only if all three answers are yes: it can introduce or fail to detect an error,
    its output is not later verified, and it eliminates, reduces or automates a project process.'
  - This applies regardless of whether it is a development, verification or validation tool.
  kind_note: handbook guidance
  review: 'auto-checked: clause and item letters or tags printed on the stated page'
- id: sw-06
  area: ECSS software (E-40, Q-80)
  type: definition
  names_standard: false
  question: In the ECSS simulation modelling platform standard, how are simulation time and mission time defined,
    and how is mission time related to epoch time?
  expected:
  - doc_id: ECSS-E-ST-40-07C
    issue: Rev.1
    cover_issue: First issue, Revision 1, 5 August 2025
    clause: 5.1.2
    req_ids:
    - 5.1.2a
    - 5.1.2b
    page: 39
  answer_points:
  - Simulation time is a non-negative duration that starts at 0 when the Building state begins and advances only
    while Executing, on restore, or via the time keeper's set-simulation-time call.
  - Mission time is a duration equal to epoch time minus the mission start time, initialised to 0 at the start of
    Building.
  - Mission time advances with epoch time, only while the environment is in Executing, and is stored and restored
    with the simulation state.
  kind_note: requirement (shall)
  review: 'auto-checked: clause and item letters or tags printed on the stated page'
