- id: qpa-02
  area: ECSS-Q PA management, QA, dependability, safety
  type: lookup
  names_standard: false
  question: In an FMEA, how do I label a failure mode whose worst effect is category 3 but only happens after all
    redundant units have failed? What suffixes exist and when must the severity be assigned?
  expected:
  - doc_id: ECSS-Q-ST-30-02C
    issue: ''
    cover_issue: 6 March 2009
    clause: '4.2'
    req_ids:
    - 4.2a
    - 4.2b
    - 4.2d
    page: 15
  expected_tables:
  - ECSS-Q-ST-30-02C|Table 4-1
  answer_points:
  - Every failure mode gets a severity category, assigned without crediting existing compensating provisions.
  - 'The category number is followed by a suffix: SH for safety hazards, R for redundancy, SP for single point failures.'
  - A redundancy case such as category 3 after loss of all redundant items is written 3R; SH is placed before the
    other suffixes.
  kind_note: requirement (shall); suffix rule d and Table 4-1 on p.16
  review: hand-checked against the source page
- id: qpa-03
  area: ECSS-Q PA management, QA, dependability, safety
  type: numeric
  names_standard: false
  question: What derating factor applies to relay contact current when the load is a motor and no motor-load rating
    is specified? What about an inductive load and a filament load?
