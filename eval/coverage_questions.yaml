- id: msu-07
  area: ECSS-M/S/U/P (management, system, sustainability)
  type: numeric
  names_standard: false
  question: For a launch vehicle upper stage left in LEO, what cumulative collision probability limit and orbit
    lifetime does the ECSS adoption of the ISO debris mitigation standard impose on debris left in orbit?
  expected:
  - doc_id: ECSS-U-AS-10C
    issue: Rev.2
    cover_issue: First issue, Revision 2, 9 February 2024
    clause: '3'
    req_ids: []
    page: 8
  expected_tables:
  - ECSS-U-AS-10C|Table 3-1
  answer_points:
  - Orbit lifetime must be under 25 years if released into or crossing the LEO protected region within 100 years.
  - The cumulative collision probability with objects larger than 1 cm until re-entry must be below 10^-3 (an ECSS-added
    condition).
  - Debris must also stay out of the GEO protected region for at least 100 years.
  kind_note: modification of ISO 24113 clause 7.1.1.3, given in Table 3-1 of the adoption notice
  review: 'auto-checked: clause and item letters or tags printed on the stated page'
