- id: msu-05
  area: ECSS-M/S/U/P (management, system, sustainability)
  type: numeric
  names_standard: false
  question: For a planetary protection case with no mission-specific numerical limit, what probability of contaminating
    a protected Solar system body with viable terrestrial organisms is allowed, and over what time span?
  expected:
  - doc_id: ECSS-U-ST-20C
    issue: ''
    cover_issue: First issue, 1 August 2019
    clause: 5.2.3
    req_ids:
    - 5.2.3a
    page: 22
  answer_points:
  - The probability must not exceed 1x10^-3.
  - The period is 50 years after the mission arrives at the protected body.
  - It applies except where the standard gives other numerical requirements.
  kind_note: requirement (shall)
  review: hand-checked against the source page
