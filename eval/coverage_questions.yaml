    issue: Rev.2
    cover_issue: Rev.2, 23 June 2021
    clause: 6.25.2
    req_ids:
    - 6.25.2a
    page: 65
  expected_tables:
  - ECSS-Q-ST-30-11C|Table 6-24
  answer_points:
  - 'Motor load: 50 % of the specified motor load rating, or 20 % of the resistive-load rating if none is specified.'
