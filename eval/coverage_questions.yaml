  review: 'auto-checked: clause and item letters or tags printed on the stated page'
- id: sw-01
  area: ECSS software (E-40, Q-80)
  type: lookup
  names_standard: false
  question: Our flight software has a low-criticality housekeeping component that shares memory with a high-criticality
    control component, and we cannot rule out that it corrupts the control component. What criticality category
    must the housekeeping component be given, and how can the problem be avoided by design?
  expected:
  - doc_id: ECSS-Q-ST-80C
    issue: Rev.2
    cover_issue: Third issue, Revision 2, 30 April 2025
    clause: 6.2.2.10
    req_ids:
    - 6.2.2.10a
    page: 44
  answer_points:
  - If failure propagation or shared resources cannot be prevented from letting a component cause failures in a
    higher-criticality one, all components involved get the highest criticality category among them.
  - So the housekeeping component is classified at the category of the control component.
  - A note says design measures such as separate hardware platforms, process isolation or no shared memory (segregation
    and partitioning) can prevent the propagation.
  kind_note: requirement (shall), with an informative note
  review: hand-checked against the source page
- id: sw-02
  area: ECSS software (E-40, Q-80)
  type: numeric
  names_standard: true
  question: In ECSS-E-ST-40, what code coverage must the supplier verify for category A and category B software
    (statement, decision, modified condition and decision), and what extra coverage applies at object code level?
  expected:
  - doc_id: ECSS-E-ST-40C
    issue: Rev.1
    cover_issue: Third issue, Revision 1, 30 April 2025
    clause: 5.8.3.5
    req_ids:
    - 5.8.3.5b
    - 5.8.3.5e
    page: 75
  answer_points:
  - 'Category A: 100% statement, decision and modified condition and decision coverage on source code.'
  - 'Category B: 100% statement and decision coverage; the modified condition and decision value is to be agreed
    with the customer (TBA).'
  - 'Categories C and D: values are to be agreed with the customer (TBA), measured as per ECSS-Q-ST-80 clause 6.3.5.2.'
  - If source to object code traceability cannot be verified, 100% object code coverage is additionally required
    for category A; not applicable to B, C, D.
  kind_note: requirement (shall); the coverage numbers are in an unnumbered table inside the requirement text
  review: 'auto-checked: clause and item letters or tags printed on the stated page'
