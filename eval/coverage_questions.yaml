- id: qpa-07
  area: ECSS-Q PA management, QA, dependability, safety
  type: definition
  names_standard: true
  question: How does ECSS-Q-ST-30 define criticality, and how does it differ from the criticality of a failure mode?
  expected:
  - doc_id: ECSS-Q-ST-30C
    issue: Rev.1
    cover_issue: Rev.1, 15 February 2017
    clause: 3.2.1
    req_ids: []
    page: 11
  answer_points:
  - Criticality classifies a function, software, hardware or operation by the severity of the consequences of its
    potential failures.
  - It considers severity only.
  - The criticality of a failure mode or risk also takes the likelihood of occurrence into account.
  kind_note: definition
  review: 'auto-checked: clause and item letters or tags printed on the stated page'
- id: qmp-01
  area: ECSS-Q EEE components, materials and processes
  type: numeric
  names_standard: false
  question: What minimum outgassing screening limits for RML and CVCM do I have to meet when selecting a material
    for spacecraft hardware, and when may a material with a higher total mass loss still be accepted?
  expected:
  - doc_id: ECSS-Q-ST-70-02C
    issue: ''
    cover_issue: 15 November 2008
    clause: 5.5.3.1
    req_ids:
    - 5.5.3.1a
    page: 26
  answer_points:
  - 'Minimum screening parameters: RML below 1,0 % and CVCM below 0,10 %'
  - Optical devices or their vicinity can need more stringent limits (note)
  - Materials with TML above 1,0 % but RML below 1,0 % are acceptable to the customer under the water-absorption
    conditions of 5.5.3.3 (no equipment below -100 degC, fast water desorption, no high voltage, dry gas purge)
  kind_note: requirement for 5.5.3.1a; acceptance of high-TML materials is a recommendation (should) in 5.5.3.3
  review: hand-checked against the source page
- id: qmp-02
  area: ECSS-Q EEE components, materials and processes
  type: numeric
  names_standard: false
  question: We want to reuse total-dose test data for a bipolar linear IC. What conditions must that TID test data
    satisfy for us to accept it, including the maximum dose rate?
  expected:
