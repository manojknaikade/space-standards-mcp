- id: qmp-05
  area: ECSS-Q EEE components, materials and processes
  type: numeric
  names_standard: false
  question: A batch of epoxy adhesive has passed its shelf life. How long can the shelf life be extended after the
    first and the second re-certification?
  expected:
  - doc_id: ECSS-Q-ST-70-22C
    issue: ''
    cover_issue: 31 July 2008
    clause: 4.1.4
    req_ids:
    - 4.1.4a
    page: 10
  answer_points:
  - First re-certification by relevant tests; if successful, shelf life is extended by half of the initial shelf
    life
  - Second re-certification is decided case by case (product, application, storage, user experience)
  - If the second one succeeds, the extension is half of the first extension
  - Batches awaiting results are kept separately and labelled as suspended (4.1.4c)
  kind_note: requirement
  review: 'auto-checked: clause and item letters or tags printed on the stated page'
- id: qmp-07
  area: ECSS-Q EEE components, materials and processes
  type: numeric
  names_standard: false
  question: How long can an EEE part sit in storage after its original date code before it must be relifed, and
    what is the latest time after the date code by which it must be mounted?
  expected:
  - doc_id: ECSS-Q-ST-60-14C
    issue: Rev.1 Corr.1
    cover_issue: Rev. 1 Corrigendum 1, 2 March 2020 (First issue, Revision 1)
    clause: '5'
    req_ids:
    - 5d
    - 5f
    page: 18
  expected_tables:
  - ECSS-Q-ST-60-14C|Table 5-1
  answer_points:
  - T1 = 7 years from the original date code is the maximum storage with no relifing control
  - T2 = 15 years is the maximum time between original date code and mounting
