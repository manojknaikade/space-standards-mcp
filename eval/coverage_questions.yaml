- id: sw-04
  area: ECSS software (E-40, Q-80)
  type: lookup
  names_standard: false
  question: We want to skip the software-level criticality classification and just keep the system-level category
    for our whole software product. Is that acceptable, and what does it imply for the project requirements?
  expected:
  - doc_id: ECSS-Q-HB-80-03A
    issue: ''
    cover_issue: First issue, 26 January 2012
    clause: 5.2.3.3
    req_ids: []
    page: 21
  answer_points:
  - The handbook says the supplier may decide to skip software-level classification and the work to prevent propagation
    between categories, keeping the system-level category for the whole product.
  - This choice can be agreed with the customer.
  - It is only acceptable if the requirements for critical software are applied to the entire software product.
