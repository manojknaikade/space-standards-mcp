- id: msu-03
  area: ECSS-M/S/U/P (management, system, sustainability)
  type: lookup
  names_standard: false
  question: A supplier wants to implement a major change to a configuration item. Does the customer have to approve
    it first, and how does that differ for a minor change?
  expected:
  - doc_id: ECSS-M-ST-40C
    issue: Rev.1
    cover_issue: Third issue, Revision 1, 6 March 2009
    clause: 5.3.2.2
    req_ids:
    - 5.3.2.2a
    - 5.3.2.2b
    page: 40
  answer_points:
  - A class 1 change (or major departure) needs customer approval before it is implemented.
  - A class 2 change (or minor departure) is implemented after the supplier's own approval, and the customer is
    informed.
  kind_note: requirement (shall)
  review: hand-checked against the source page
