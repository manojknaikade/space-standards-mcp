- id: qpa-01
  area: ECSS-Q PA management, QA, dependability, safety
  type: lookup
  names_standard: false
  question: Who is allowed to close out a nonconformance report, and what extra step is needed before a major one
    can be closed?
  expected:
  - doc_id: ECSS-Q-ST-10-09C
    issue: Rev.1
    cover_issue: Rev.1, 1 March 2018
    clause: 5.4.2
    req_ids:
    - 5.4.2b
    - 5.4.2c
    page: 20
  answer_points:
  - The supplier's product assurance representative closes out the NCR.
