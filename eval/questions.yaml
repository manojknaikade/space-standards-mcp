  review_note: "Review 10 Oct (Claude for the owner, B3 PDF check): IDs and Table 3 checked. 11 Oct (owner decision, round 4): reference widened to ECSS-E-ST-32-10C Table 4-3 (verified tier; glass and ceramic rows)."

