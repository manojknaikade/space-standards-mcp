# Evaluation set — launcher and payload-fairing structures
#
# Status: 78 questions. v1 (fs-001…fs-021) reviewed by the domain owner, 7 October 2026: all ok.
# Hand-test questions (hand-01…hand-20): review waived. v2 additions (fs-022…fs-037), wave-1 additions
# (w1-001…w1-011) and the six rewrites of 10 Oct: reviewed 10 Oct against the PDFs (Claude for the owner, B3), all ok
# after four edits (hand-18, fs-025, fs-033, w1-003; see their review_note).
# Wave-2 additions (w2-001…w2-010) are drafted and pending owner review.
# New questions: set `review: pending`, then `ok` or `fix` + `review_note` after review.
#
# Source documents (local, not committed):
#   ECSS-E-ST-32-01C Rev.2 (30 July 2021)   Fracture control
#   ECSS-E-ST-32-08C Rev.1 (15 October 2014) Materials
#   NASA-STD-5001B w/Change 3 (2022-10-24)   Structural design and test factors of safety
#   ECSS-E-ST-32-10C Rev.2 Corr.1 (1 August 2019) Structural factors of safety (PDF)
#
# Rules (ADR-0002, CLAUDE.md):
# - expected_ids: "<doc_id>|<req_id>", must exist in the source documents.
# - expected_tables: "<doc_id>|<table_id>" for questions whose numbers live in a table (retrieval eval
#   scores whether a top-k hit matched a row of it or points to it).
#   ECSS IDs = clause + letter (letters restart at each clause). NASA IDs = FSR n.
# - reference_answer / answer_points are paraphrases, never verbatim standard text.
# - numeric answers carry value + basis + condition.
# - kind_note flags where the source is guidance/permission rather than a "shall".

- id: fs-001
  type: numeric
  question: Under NASA-STD-5001B, what are the minimum design and test factors for a metallic structure verified with the prototype approach?
  expected_ids: ["NASA-STD-5001B|FSR 24"]
  expected_tables: ["NASA-STD-5001B|Table 1"]
  reference_answer: >
    Table 1: ultimate design factor 1.4, yield design factor 1.0 (structure must still be
    assessed to prevent detrimental yielding in service, acceptance or proof testing),
    qualification test factor 1.4. Proof test factor is not applicable, except 1.05 for
    propellant tanks and SRM cases.
  answer_points:
    - "ultimate design factor 1.4"
    - "yield design factor 1.0, with assessment against detrimental yielding"
    - "qualification test factor 1.4"
    - "proof factor 1.05 only for propellant tanks and SRM cases"
  review: ok

- id: fs-002
  type: numeric
  question: For a metallic payload-fairing structure qualified with a protoflight approach under NASA-STD-5001B, what yield design factor and test factor apply, and why is the yield factor higher than for prototype?
  expected_ids: ["NASA-STD-5001B|FSR 24", "NASA-STD-5001B|FSR 14"]
  expected_tables: ["NASA-STD-5001B|Table 1"]
  reference_answer: >
    Table 1 protoflight row: yield design factor 1.25, ultimate design factor 1.4,
    qualification (protoflight) test factor 1.2. The flight article itself is tested above
    limit load, so the higher yield factor protects it from detrimental yielding during
    the test (FSR 14 requires design factors that prevent this).
  answer_points:
    - "yield design factor 1.25"
    - "test factor 1.2 (ultimate stays 1.4)"
    - "higher yield factor protects the flight article from yielding during the protoflight test"
  kind_note: "The 'why' is explanatory guidance text in 4.1.1, plus FSR 14."
  review: ok

- id: fs-003
  type: numeric
  question: What ultimate design factor does NASA-STD-5001B require at a discontinuity area (e.g. a bolted joint or insert) of a composite structure verified by prototype test, and can it be reduced?
  expected_ids: ["NASA-STD-5001B|FSR 29"]
  expected_tables: ["NASA-STD-5001B|Table 2"]
  reference_answer: >
    Table 2: 2.0 on concentrated stresses at discontinuity areas, with qualification test
    factor 1.4 and proof factor 1.05 for prototype. For non-safety-critical applications
    the 2.0 may be reduced to 1.4 for prototype (1.5 for protoflight).
  answer_points:
    - "2.0 applied to concentrated stresses at discontinuities"
    - "may drop to 1.4 (prototype) / 1.5 (protoflight) if not safety-critical"
  review: ok

- id: fs-004
  type: numeric
  question: Under NASA-STD-5001B, which design and test factors apply to uniform (non-discontinuity) composite structure verified with the protoflight approach, and does each flight article need a proof test?
  expected_ids: ["NASA-STD-5001B|FSR 29"]
  expected_tables: ["NASA-STD-5001B|Table 2"]
  reference_answer: >
    Table 2 protoflight, uniform material: ultimate design factor 1.5, protoflight test
    factor 1.2, proof test factor 1.2. Each composite/bonded flight article is proof tested
    unless the alternate-approach provisions of section 4.6 are met.
  answer_points:
    - "ultimate 1.5"
    - "test factor 1.2, proof factor 1.2"
    - "every flight article proof tested unless section 4.6 alternate approach applies"
  kind_note: "Proof-test-every-article statement is guidance text under 4.2.3."
  review: ok

- id: fs-005
  type: classification
  question: A fairing uses aluminium honeycomb core with aluminium face sheets. Does NASA-STD-5001B treat it as composite/bonded or metallic structure for factors of safety?
  expected_ids: ["NASA-STD-5001B|FSR 29"]
  reference_answer: >
    Metallic honeycomb (face sheets and core) is considered metallic structure, so Table 1
    (metallic) factors apply rather than Table 2. Note that the bonds still make it a bonded
    construction in other respects (e.g. fracture control under ECSS-E-ST-32-01 clause 8.4).
  answer_points:
    - "metallic honeycomb counts as metallic structure"
    - "Table 1 factors, not Table 2"
  kind_note: "Statement is guidance text directly under FSR 29, not a numbered requirement. The ECSS remark is Claude's addition — please confirm or delete."
  review: ok

- id: fs-006
  type: lookup
  question: What does NASA-STD-5001B require for buckling of thin-walled shell structures such as an interstage or fairing cylinder?
  expected_ids: ["NASA-STD-5001B|FSR 53", "NASA-STD-5001B|FSR 55", "NASA-STD-5001B|FSR 56"]
  reference_answer: >
    Design loads for buckling are ultimate loads (FSR 53). Evaluation covers general and
    local/panel instability, crippling and creep (FSR 55). Analyses of thin-walled shells
    must account for differences between idealised and real geometry and boundary
    conditions (FSR 56); guidance points to knockdown factors in NASA-SP-8007 and warns that
    the 0.65 composite-shell KDF may be unconservative (NESC TB 16-01).
  answer_points:
    - "buckling designed to ultimate loads"
    - "general, local/panel instability, crippling, creep"
    - "account for imperfections/boundary conditions (knockdown factors)"
  review: ok

- id: fs-007
  type: lookup
  question: Can a metallic structure be qualified by analysis only ("no-test") under NASA-STD-5001B, and what is needed?
  expected_ids: ["NASA-STD-5001B|FSR 15", "NASA-STD-5001B|FSR 16"]
  reference_answer: >
    Only metallic structures may use the no-test option. Analysis must come with an
    acceptable engineering rationale (FSR 15), and project-specific criteria and rationale
    must be approved by the delegated Technical Authority (FSR 16). Guidance: higher factors
    alone do not justify no-test; typical justifications are simple determinate load paths,
    close similarity to a test-verified structure, or tested critical elements.
  answer_points:
    - "metallic only"
    - "engineering rationale + Technical Authority approval of project criteria"
    - "higher factors alone are not sufficient justification"
  review: ok

- id: fs-008
  type: classification
  question: Under ECSS-E-ST-32-01C, can an expendable launcher (unmanned, single mission) apply a reduced fracture control programme, and which items must then be identified as PFCI?
  expected_ids: ["ECSS-E-ST-32-01C|5.1e", "ECSS-E-ST-32-01C|11.2.2.1a"]
  reference_answer: >
    Yes — unmanned, single-mission space vehicles, their payloads and GSE may use the
    reduced fracture control programme of clause 11 (5.1e). PFCI identification may then be
    limited to: pressurized systems; rotating machinery; fasteners in safe-life
    applications; welded, forged or cast items above 25 % of UTS at limit stress;
    non-metallic structural items; and metallic safe-life items above 50 % of yield at
    limit stress (11.2.2.1a). With customer approval the last category can be narrowed to
    single-point-of-failure tension items such as lugs, isostatic mounts, struts and pins.
  answer_points:
    - "RFCP allowed for unmanned single-mission vehicles (5.1e)"
    - "six PFCI categories incl. 25 % UTS (welded/forged/cast) and 50 % yield (metallic safe life)"
    - "customer can narrow metallic category to single-load-path tension items"
  kind_note: "Both are permissions ('may'), not mandatory requirements."
  review: ok

- id: fs-009
  type: numeric
  question: For a metallic safe-life item under ECSS-E-ST-32-01C, what life factor and initial crack-size detectability apply?
  expected_ids: ["ECSS-E-ST-32-01C|6.3.2b", "ECSS-E-ST-32-01C|6.3.2c", "ECSS-E-ST-32-01C|7.2.8c"]
  reference_answer: >
    The worst crack must not grow to the point where minimum performance is lost using a
    design life factor of at least 4 (6.3.2c); the load spectrum is applied at least four
    times in sequence in the crack growth analysis (7.2.8c). Unless otherwise specified, the
    NDT method used must find the assumed initial crack with at least 90 % probability at
    95 % confidence (6.3.2b).
  answer_points:
    - "life factor 4"
    - "spectrum applied 4 times in sequence"
    - "initial crack detectable at 90 % probability / 95 % confidence"
  review: ok

- id: fs-010
  type: numeric
  question: What load enhancement factor and life factor does ECSS-E-ST-32-01C require for a safe-life composite or sandwich item, and what must the structure still achieve?
  expected_ids: ["ECSS-E-ST-32-01C|6.3.2e", "ECSS-E-ST-32-01C|8.4.4.2e"]
  reference_answer: >
    Life factor 1 with a load enhancement factor of 1.15; the worst damage must not grow
    within the safe-life interval and the structure must still carry ultimate load (6.3.2e).
    The test programme must demonstrate ultimate load capability and no defect growth after
    one service life with LEF 1.15, on articles representative of manufacturing,
    environment and loading (8.4.4.2e).
  answer_points:
    - "LEF 1.15, life factor 1"
    - "no damage growth and ultimate load capability retained"
  review: ok

- id: fs-011
  type: numeric
  question: In a fail-safe design under ECSS-E-ST-32-01C, what load must the remaining structure carry after one element fails, for metallic versus composite parts?
  expected_ids: ["ECSS-E-ST-32-01C|6.3.3b"]
  reference_answer: >
    Limit load times 1.0 for metal and glass parts, or times 1.15 for composite, bonded
    and sandwich parts, while still meeting the minimum specified performance (no
    large-scale yielding). Under the reduced programme, where fatigue is
    not significant, the customer may accept a factor between 1.0 and 1.15 for composites.
  answer_points:
    - "1.0 x limit load for metallic/glass"
    - "1.15 x limit load for composite/bonded/sandwich"
    - "RFCP note allows lower composite factor (>= 1.0) with customer approval"
  review: ok

- id: fs-012
  type: classification
  question: Can a metallic fitting be classified as a low-risk fracture item under ECSS-E-ST-32-01C? Give the stress limit and the item types that are excluded.
  expected_ids: ["ECSS-E-ST-32-01C|6.3.5.2a", "ECSS-E-ST-32-01C|6.3.5.2b", "ECSS-E-ST-32-01C|6.3.5.2c"]
  reference_answer: >
    Possibly, if agreed with the customer (6.3.5.2c). Maximum net-section tensile stress at
    limit load must not exceed 30 % of the ultimate tensile strength (6.3.5.2b). Excluded:
    pressure shells of crewed modules, pressure vessels, pressurized components with
    hazardous fluid, high-energy rotating machinery, and fasteners (6.3.5.2a). The criteria
    of 6.3.5.3 (material, process, 100 % visual and part-level NDT, crack growth) also apply.
  answer_points:
    - "<= 30 % UTS net section at limit load"
    - "fasteners and pressure hardware excluded"
    - "customer agreement required"
  review: ok

- id: fs-013
  type: numeric
  question: Under the ECSS reduced fracture control programme, what proof test is required for a safe-life composite or sandwich structure such as a fairing panel, and how does it compare with the full programme?
  expected_ids: ["ECSS-E-ST-32-01C|11.2.2.5a", "ECSS-E-ST-32-01C|8.4.4.2g"]
  reference_answer: >
    Reduced programme: proof test to at least 1.1 times flight limit load per a
    customer-approved proof test plan, with proof loads recommended not to exceed 80 % of
    ultimate (11.2.2.5a). In the full programme, a proof test used for manufacturing-defect
    screening needs a factor of at least 1.2 on limit load, proof loads not above 80 % of
    ultimate, post-test NDT and customer approval (8.4.4.2g).
  answer_points:
    - "RFCP: >= 1.1 x flight limit load"
    - "full programme screening proof: >= 1.2 x limit load"
    - "proof loads <= 80 % of ultimate"
  review: ok

- id: fs-014
  type: classification
  question: When may a composite item be accepted as low-risk fracture under ECSS-E-ST-32-01C without testing the damage tolerance threshold strain?
  expected_ids: ["ECSS-E-ST-32-01C|8.4.4.3e", "ECSS-E-ST-32-01C|8.4.4.3f"]
  reference_answer: >
    Strain at limit load must be below the damage tolerance threshold strain (8.4.4.3e).
    With customer approval this can be assumed without specific testing if, at limit load
    and including stress concentrations, maximum tensile stress is below 40 % and maximum
    compressive stress below 25 % of the material ultimate capability (8.4.4.3f).
  answer_points:
    - "tension < 40 % of ultimate, compression < 25 % (incl. Kt)"
    - "customer approval needed"
  review: ok

- id: fs-015
  type: lookup
  question: Can titanium or small-diameter fasteners be used in safe-life applications under ECSS-E-ST-32-01C?
  expected_ids: ["ECSS-E-ST-32-01C|8.8a", "ECSS-E-ST-32-01C|8.8b", "ECSS-E-ST-32-01C|11.2.2.7a", "ECSS-E-ST-32-01C|11.2.2.7b"]
  reference_answer: >
    In the full programme, fasteners below 5 mm diameter (3/16 in) and titanium alloy
    fasteners are not allowed in safe-life applications (8.8a, 8.8b). Under the reduced
    programme, titanium fasteners may be used in safe life if the 11.2.2.7a conditions are
    met (crack growth with a = c = 0.63 mm over four lifetimes, standard surface NDT,
    SCC-resistant alloy, not in a pressurized shell) or the 11.2.2.7b conditions (incl.
    sustained-load K below threshold or K < 0.5 KIC, customer approval). The 5 mm minimum
    still applies.
  answer_points:
    - "< 5 mm not allowed in safe life (always)"
    - "titanium not allowed in full programme"
    - "titanium allowed under RFCP with 11.2.2.7a or b conditions"
  review: ok

- id: fs-016
  type: numeric
  question: What initial crack sizes does ECSS-E-ST-32-01C assume for the low-risk approach of metallic safe-life parts under the reduced fracture control programme?
  expected_ids: ["ECSS-E-ST-32-01C|11.2.2.6a"]
  reference_answer: >
    Surface cracks 0.63 mm deep by 1.27 mm long, 0.63 mm radius corner cracks at holes
    and edges, or 1.27 mm long through cracks, which must not grow to failure in less than
    four service lifetimes. Further conditions include standard fracture control surface
    NDT (X-ray not sufficient), well-characterised SCC-resistant alloy, no defect-prone
    process, and not pressurized hardware.
  answer_points:
    - "0.63 mm deep x 1.27 mm surface crack; 0.63 mm corner; 1.27 mm through"
    - "four lifetimes"
    - "standard surface NDT, SCC-resistant alloy, not pressurized"
  review: ok

- id: fs-017
  type: lookup
  question: What does ECSS-E-ST-32-08C require about fastening into composite parts and about inserts in sandwich panels?
  expected_ids: ["ECSS-E-ST-32-08C|4.4.1a", "ECSS-E-ST-32-08C|4.4.1b", "ECSS-E-ST-32-08C|4.4.4a"]
  reference_answer: >
    Tapped screws must not be used in composite materials, to avoid damage (4.4.1b);
    galvanic corrosion from dissimilar-material contact must be precluded (4.4.1a); and all
    inserts must have corrosion-protected surfaces (4.4.4a).
  answer_points:
    - "no tapped screws in composites"
    - "preclude galvanic corrosion"
    - "inserts corrosion protected"
  review: ok

- id: fs-018
  type: lookup
  question: Under ECSS-E-ST-32-08C, what must be included when deriving composite design allowables, and who approves them?
  expected_ids: ["ECSS-E-ST-32-08C|4.5.2a", "ECSS-E-ST-32-08C|4.5.2c", "ECSS-E-ST-32-08C|4.5.2g"]
  reference_answer: >
    Allowables must account for manufacturing process control, deviation of lamina
    properties from nominal, failure modes (fibre, matrix, interface), cure residual strains,
    combined loading, scatter in compression strength, environmental susceptibility and
    non-linearity (4.5.2a). Allowables used in pre-dimensioning are justified to the
    customer for approval (4.5.2c), and the test plan states the statistical basis and how
    lay-up interpolation is done (4.5.2g).
  answer_points:
    - "process control, lamina deviation, failure modes, residual strain, combined loading, compression scatter, environment"
    - "customer approval of allowables"
    - "test plan gives statistical basis"
  kind_note: "Source ambiguity: in 4.5.2a only five items are numbered (process control, cure residual strains, combined loading, compression scatter, environment). Lamina deviation, failure modes and non-linearity sit in NOTE-styled paragraphs between them, likely a formatting error. Please confirm whether they count as requirement items."
  review: ok

- id: fs-019
  type: compare
  question: Compare the fatigue / service-life factor required by NASA-STD-5001B and ECSS-E-ST-32-01C for metallic structure.
  expected_ids: ["NASA-STD-5001B|FSR 51", "ECSS-E-ST-32-01C|6.3.2c", "ECSS-E-ST-32-01C|6.3.3e", "ECSS-E-ST-32-01C|6.3.2e"]
  reference_answer: >
    Both use 4. NASA requires a minimum service life factor of 4.0 for fatigue and creep
    of well-characterised materials, with possible additional factors for composites or
    poorly characterised materials (FSR 51). ECSS fracture control uses a design life factor
    of at least 4 for metallic safe-life crack growth (6.3.2c) and for fatigue of the
    remaining structure of metallic fail-safe items, with mean fatigue properties (6.3.3e).
    Composites under ECSS instead use life factor 1 with LEF 1.15.
  answer_points:
    - "NASA 4.0 (fatigue and creep)"
    - "ECSS 4 for metallic safe-life and fail-safe fatigue"
    - "ECSS composites: life factor 1 + LEF 1.15"
  review: ok

- id: fs-020
  type: numeric
  question: What yield and ultimate factors of safety does ECSS require for metallic parts of an expendable launch vehicle, and how are they applied to the limit load?
  expected_ids: ["ECSS-E-ST-32-10C|4.3.2.1a", "ECSS-E-ST-32-10C|4.3.2.1d", "ECSS-E-ST-32-10C|4.2.1a", "ECSS-E-ST-32-10C|4.1.5.3a"]
  expected_tables: ["ECSS-E-ST-32-10C|Table 4-3", "ECSS-E-ST-32-10C|Table 4-1"]
  reference_answer: >
    Table 4-3, launch vehicle, metallic parts: FOSY 1.1 and FOSU 1.25 with test; for
    verification by analysis only FOSU 2.0, while FOSY has no commonly agreed value (note c).
    The FOS is not applied alone: per Table 4-1, for launch vehicles DLL = LL x KP x KM,
    then DYL = DLL x FOSY x KMP x KLD and DUL = DLL x FOSU x KMP x KLD, where the margin policy
    factor KMP is mandatory for launch vehicles (4.1.5.3a). FOSU and FOSY on thermally
    induced loads are 1.0 for expendable launch vehicles (4.3.2.1d).
  answer_points:
    - "FOSY 1.1, FOSU 1.25 (tested)"
    - "analysis only: FOSU 2.0, FOSY not agreed"
    - "applied with KP, KM, KMP, KLD per Table 4-1; KMP required for launch vehicles"
    - "thermal loads: factors 1.0 for expendable launchers"
  kind_note: "Replaces the earlier not-covered trap, since ECSS-E-ST-32-10 is now loaded. Contrast with NASA-STD-5001B metallic prototype (1.0 yield / 1.4 ultimate) is a good follow-up compare question."
  review: ok

- id: fs-021
  type: compare
  question: What acoustic test levels and duration apply to qualify a payload fairing?
  expected_ids: ["NASA-STD-7001C|PVTR 2", "NASA-STD-7001C|PVTR 43", "ECSS-E-ST-10-03C|4.5.2f"]
  expected_tables: ["NASA-STD-7001C|Table 1", "ECSS-E-ST-10-03C|Table 5-2"]
  answer_points:
    - "NASA-STD-7001C: envelope of flight acceptance levels plus 3 dB, at least 2 minutes (2 + 0.5N for N reflights)"
    - "ECSS-E-ST-10-03C: maximum expected acoustic spectrum plus 3 dB (higher margins from the launcher authority apply), 2 minutes, one test"
    - "no structural test factors reused as acoustic margins"
  review: ok
  review_note: "Wave 1 (B5, 10 Oct): was not_covered while 7001 / 10-03 were not loaded. Owner, 10 Oct: both standards apply to the PLF."

