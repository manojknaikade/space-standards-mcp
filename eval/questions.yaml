- id: fs-022
  type: numeric
  question: What scatter factor does ECSS-E-ST-32 require in fatigue analysis, and how is it applied to the service life?
  expected_ids: ["ECSS-E-ST-32C|4.5.18a", "ECSS-E-ST-32C|4.6.2.8c"]
  reference_answer: >
    A scatter factor of 4 is used in fatigue analysis. It multiplies the number of cycles at a
    load level: the life is verified for the specified service life times the scatter factor, with
    the most unfavourable load sequence within each event. Notes: higher factors can apply (e.g.
    pressure vessels, low-cycle fatigue); for composites a factor on stress may be used instead.
  answer_points:
    - "scatter factor 4 in fatigue analysis"
    - "applied to the number of cycles: service life x scatter factor, worst load sequence per event"
    - "notes: higher for some applications; composites may use a stress factor instead"
  kind_note: "The higher-factor and composite remarks are NOTEs to 4.5.18a, not requirements."
  review: ok
  review_note: "Review 10 Oct (Claude for the owner, B3 PDF check): IDs and NOTEs checked."

- id: fs-023
