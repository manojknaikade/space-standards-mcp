- id: fs-027
  type: compare
  question: Compare what ECSS-E-ST-32-01 and NASA-STD-5019A require of the remaining structure for a part to be accepted as fail-safe.
  expected_ids: ["ECSS-E-ST-32-01C|6.3.3b", "ECSS-E-ST-32-01C|6.3.3c", "NASA-STD-5019A|FCR 8 / 6.2.3.a", "NASA-STD-5019A|FCR 8 / 6.2.3.c"]
  reference_answer: >
    ECSS: after failure of any element, the remaining structure carries limit loads times 1.0
    (metallic, glass) or 1.15 (composite, bonded, sandwich) without losing minimum performance, and
    no released fragment may create a catastrophic hazard. NASA: loss of any load path is not a
    catastrophic hazard and multi-site damage is not a credible concern; the remaining structure
    sustains all redistributed loads and environments until mission end or inspection. Composite or
    bonded parts hit by the failed part carry DUL with the worst impact damage (DLL for the fail-safe
    part's own remaining composite structure; fracture-critical ones take the damage into their DTA).
  answer_points:
    - "ECSS: limit loads x 1.0 metallic/glass, x 1.15 composite/bonded/sandwich"
    - "ECSS: no catastrophic release of fragments"
    - "NASA: no catastrophic hazard on loss of a load path; remaining structure carries redistributed loads until end of mission"
    - "NASA: no explicit factor on the remaining structure for metallic parts"
  review: ok
  review_note: "Review 10 Oct (Claude for the owner, B3 PDF check): Checked."

