- id: w2-001
  type: numeric
  question: Under ECSS-E-ST-31-02C, what random vibration qualification duration and plateau level apply to heat transport equipment on an external panel, and what applies to equipment that is not on an external panel?
  expected_ids: ["ECSS-E-ST-31-02C|5.6.10.3a"]
  expected_tables: ["ECSS-E-ST-31-02C|Table 5-6"]
  reference_answer: >
    Table 5-6: 2.5 minutes per axis in every case. For equipment on an external panel (panel directly excited
    by the payload acoustic environment) or at an unknown location, the 100-300 Hz plateau is 0.12 g2/Hz
    times (M + 20 kg)/(M + 1 kg) in the vertical axis and 0.05 g2/Hz times the same mass factor in the lateral
    axis. For equipment not on an external panel the plateau is 0.05 g2/Hz times the mass factor in all axes.
    The spectrum rises at 3 dB/octave from 20 Hz and falls at 5 dB/octave above 300 Hz. M is the equipment mass in kg.
  answer_points:
    - "duration 2.5 minutes per axis"
    - "external panel or unknown location: plateau 0.12 g2/Hz (vertical) and 0.05 g2/Hz (lateral), each times (M + 20)/(M + 1) with M in kg"
    - "not on an external panel: 0.05 g2/Hz times the mass factor, all axes"
  review: pending

- id: w2-002
  type: numeric
  question: What ultimate and yield factors of safety apply to a metallic pyrotechnic component on a launch vehicle that must not rupture in operation, and where does ECSS-E-ST-33-11C get them from?
  expected_ids: ["ECSS-E-ST-33-11C|4.2.5.2b", "ECSS-E-ST-33-11C|4.2.5.2c"]
  expected_tables: ["ECSS-E-ST-32-10C|Table 4-3"]
  reference_answer: >
    ECSS-E-ST-33-11C requires such a component to withstand the maximum expected operational loads times an
    ultimate factor FOSU, and takes FOSU from Table 4-3 of ECSS-E-ST-32-10 for the material used. For metallic
    parts on a launch vehicle that table gives FOSU 1.25 and FOSY 1.1 (the analysis-only verification FOSU is 2.0).
  answer_points:
    - "component loaded to maximum expected operational loads times FOSU"
    - "FOSU follows ECSS-E-ST-32-10 Table 4-3 for the material"
    - "metallic, launch vehicle: FOSU 1.25, FOSY 1.1"
  review: pending

