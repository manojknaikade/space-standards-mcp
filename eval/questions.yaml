- id: w2-004
  type: compare
  question: How do NASA-STD-6016C and ECSS-E-ST-32-08C control stress corrosion cracking of metallic materials?
  expected_ids: ["NASA-STD-6016C|MPR 56", "ECSS-E-ST-32-08C|4.6.3c", "ECSS-E-ST-32-08C|4.6.3a"]
  reference_answer: >
    NASA-STD-6016C uses MSFC-STD-3029A to select metallic materials for stress corrosion resistance in sea
    and air environments, with listed exceptions that need no material usage agreement (low-stress electronic
    parts, compressively loaded bearing-type applications, non-mission-critical hardware). ECSS-E-ST-32-08C
    instead lists stress corrosion tests among the tests that characterise a metallic material and requires
    them to follow clause 5 of ECSS-Q-ST-70-37.
  answer_points:
    - "NASA-STD-6016C: select materials per MSFC-STD-3029A, with defined exceptions to the usage agreement"
    - "ECSS-E-ST-32-08C: stress corrosion tests are part of material characterisation"
    - "ECSS-E-ST-32-08C: tests follow ECSS-Q-ST-70-37 clause 5"
  review: pending

- id: w2-005
  type: lookup
  question: According to NASA-HDBK-7010, how should control microphones be placed for a direct field acoustic test?
  expected_ids: ["NASA-HDBK-7010|6.3.1"]
  reference_answer: >
    Several control microphones are recommended, placed around the test article circumferentially at
    elevations chosen from analytical predictions, with minimum standoff distances from the article and from
    the loudspeakers. Their number and spacing should be enough that their average represents the true spatial
    average of the sound field, including spatial variations. Symmetric placement relative to the loudspeakers is advised.
  answer_points:
    - "multiple microphones placed circumferentially, at elevations from analytical predictions"
    - "minimum standoff distances from the test article and from the speakers"
    - "number and spacing adequate for the average to approximate the true spatial average"
  kind_note: "Guidance (handbook recommendation), not a requirement."
  review: pending

- id: w2-006
  type: search
  question: Why can a reverberant-chamber acoustic test overtest low mass-to-area structures such as antennas or solar arrays?
  expected_ids: ["NASA-HDBK-7010|8.2.2"]
  reference_answer: >
    Coupling between a structural mode and an acoustic standing wave of the chamber can strongly amplify the
    response of lightweight, large-area structures. The handbook cites a test panel tuned to coincide with
    chamber modes, whose response changed strongly.
  answer_points:
    - "structure and acoustic mode coupling in the chamber causes the overtest"
    - "affects low mass-to-area structures such as antennas and solar arrays"
    - "demonstrated with a panel tuned to chamber modes"
  kind_note: "Guidance (handbook discussion), not a requirement."
  review: pending

- id: w2-007
  type: lookup
  question: Does a sine vibration test cover the static load of equipment, according to ECSS-E-HB-10-03A, and what are its limits compared with a static test?
  expected_ids: ["ECSS-E-HB-10-03A|5.2a"]
  reference_answer: >
    Usually yes, sine vibration covers the static load for equipment, with exceptions such as entry, descent and
    landing loads. A static test can combine loads on several axes and apply unsymmetric (tension and compression)
    loading, whereas sine vibration excites one axis symmetrically; in the vertical direction gravity makes the
    loading unsymmetric anyway.
  answer_points:
    - "sine vibration usually covers the static load, with exceptions such as entry, descent and landing loads"
    - "static test can combine axes and use unsymmetric loading; sine excites one axis symmetrically"
    - "gravity acts as a constant load that must be considered in the vibration set-up"
  kind_note: "Guidance (handbook note), not a requirement."
  review: pending

