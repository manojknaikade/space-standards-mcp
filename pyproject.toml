[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "space-standards-mcp"
version = "0.2.3"
description = "MCP server for cited, requirement-level Q&A over ECSS and NASA standards (bring your own documents)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "ecss", "nasa", "standards", "requirements", "aerospace", "space", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
authors = [{ name = "Manoj Naikade" }]
dependencies = [
  "mcp>=2.2,<3",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "lxml>=5",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26", "ruff>=0.6"]
embed = ["fastembed>=0.5", "numpy>=1.26"]  # hybrid search + reranking (SPACESTD_EMBED / SPACESTD_RERANK)
eval = ["anthropic>=1.12,<2"]  # eval/run_answer_eval.py --backend api|agent / --judge api
agent = ["anthropic>=1.12,<2"]  # python -m spacestd_agent

[project.urls]
Homepage = "https://github.com/manojknaikade/space-standards-mcp"
Repository = "https://github.com/manojknaikade/space-standards-mcp"
Issues = "https://github.com/manojknaikade/space-standards-mcp/issues"

[project.scripts]
space-standards-mcp = "spacestd.server:main"
space-standards-agent = "spacestd_agent.__main__:main"

[tool.hatch.build.targets.sdist]
# Source and metadata only: no tests, eval data, documents folder or docs (the repository has them).
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/spacestd", "src/spacestd_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["documents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Long lines exist in prose-heavy strings and test data; formatting is not enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_parsers.py" = ["E741"]  # `I` is a roman-numeral fixture variable
